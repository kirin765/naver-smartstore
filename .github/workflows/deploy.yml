name: Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target: production | staging | preview'
        required: false
        default: ''
      ref:
        description: 'Deploy this git ref. Default is current checked out SHA.'
        required: false
        default: ''

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
      VERCEL_PREVIEW_PROJECT_ID: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile=false

      - name: Build
        run: corepack pnpm --filter web build

      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.environment }}" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_ENV="production"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            DEPLOY_ENV="staging"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            DEPLOY_ENV="preview"
          else
            DEPLOY_ENV="preview"
          fi

          case "$DEPLOY_ENV" in
            production)
              PROJECT_ID="$VERCEL_PROJECT_ID"
              TARGET_ARGS="--prod --confirm"
              ;;
            staging)
              PROJECT_ID="$VERCEL_STAGING_PROJECT_ID"
              TARGET_ARGS="--prod --confirm"
              ;;
            preview)
              PROJECT_ID="${VERCEL_PREVIEW_PROJECT_ID:-$VERCEL_STAGING_PROJECT_ID}"
              TARGET_ARGS="--confirm"
              ;;
            *)
              echo "Invalid environment: $DEPLOY_ENV"
              exit 1
              ;;
          esac

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing project id for environment '$DEPLOY_ENV'."
            echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
            echo "project_id=" >> "$GITHUB_OUTPUT"
            echo "target_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "target_args=$TARGET_ARGS" >> "$GITHUB_OUTPUT"

          if [ -n "$VERCEL_SCOPE" ]; then
            RESOLVE_SCOPE="$VERCEL_SCOPE"
          else
            RESOLVE_SCOPE="$VERCEL_ORG_ID"
          fi

          if [ -z "$RESOLVE_SCOPE" ]; then
            echo "::error::Missing VERCEL_SCOPE and VERCEL_ORG_ID. set one of them."
          fi

          echo "scope=$RESOLVE_SCOPE" >> "$GITHUB_OUTPUT"

      - name: Validate Vercel credentials
        id: credential
        run: |
          if [ -z "${{ steps.target.outputs.project_id }}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_project" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${{ steps.target.outputs.scope }}" ] || [ -z "${{ env.VERCEL_TOKEN }}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_credentials" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Vercel Deploy
        if: ${{ steps.credential.outputs.ok == 'true' }}
        run: |
          corepack pnpm dlx vercel \
            ${{ steps.target.outputs.target_args }} \
            --token "$VERCEL_TOKEN" \
            --scope "${{ steps.target.outputs.scope }}" \
            --yes \
            --project "${{ steps.target.outputs.project_id }}" \
            --cwd apps/web

      - name: Deployment skipped (missing Vercel secrets)
        if: ${{ steps.credential.outputs.ok == 'false' && steps.credential.outputs.reason == 'missing_credentials' }}
        run: echo "Vercel credentials are not set (VERCEL_TOKEN + VERCEL_SCOPE / VERCEL_ORG_ID); skip deploy."

      - name: Deployment skipped (missing target project)
        if: ${{ steps.target.outputs.project_id == '' }}
        run: echo "Target project id is missing for environment '${{ steps.target.outputs.deploy_env }}'; skip deploy."
